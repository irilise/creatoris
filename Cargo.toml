[package]
name = "creatoris"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy for ECS and rendering. Bevy 0.19.1 drives a wgpu-based renderer that
# compiles the WGSL shaders in assets/shaders and selects a native backend
# (Metal on macOS) automatically.
bevy = { version = "0.19.1" }

# Logging
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }

# Double-precision orbital math (Celestia-compatible)
glam = "0.32"

# Image loading for textures
image = "0.25"

# WGSL shader compilation and validation (Bevy includes this)
# wgpu is already included as a dependency of Bevy 0.19.x

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
